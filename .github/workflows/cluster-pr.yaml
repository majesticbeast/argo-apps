name: vCluster PR Environments

on:
  pull_request:
    types: [opened, reopened, closed]

jobs:
  manage-vcluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Create vCluster app on PR open
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        run: |
          PR=${{ github.event.pull_request.number }}
          sed "s/{{PR_NUMBER}}/$PR/g" vclusters/template.yaml > vclusters/pr-$PR.yaml
          git config user.email "ci@example.com"
          git config user.name "CI"
          git add vclusters/pr-$PR.yaml
          git commit -m "feat: add vcluster for PR #$PR"
          git push

      - name: Delete vCluster app on PR close
        if: github.event.action == 'closed'
        run: |
          PR=${{ github.event.pull_request.number }}
          git config user.email "ci@example.com"
          git config user.name "CI"
          git rm vclusters/pr-$PR.yaml
          git commit -m "chore: remove vcluster for PR #$PR"
          git push
